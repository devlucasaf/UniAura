<div class="site">
    <div data-chrome="header"></div>

    <nav class="site-breadcrumb" aria-label="Você está aqui">
        <div class="site-container">
            <a href="#/home">Início</a>
            <span aria-hidden="true">›</span>
            <span>Sobre</span>
            <span aria-hidden="true">›</span>
            <span class="site-breadcrumb-atual">Nossa Equipe</span>
        </div>
    </nav>

    <section class="site-pagina-hero">
        <div class="site-container">
            <span class="site-eyebrow">Quem faz o Áurea</span>
            <h1>Nossa Equipe</h1>
            <p class="site-pagina-hero-lead">
                Mais de 120 profissionais dedicados a fazer do Colégio Áurea um lugar de aprendizado,
                acolhimento e transformação.
            </p>
        </div>
    </section>

    <section class="site-section">
        <div class="site-container">

            <div class="site-equipe-filtros" role="tablist" aria-label="Filtrar equipe por profissão">
                <button class="site-filtro-btn ativo" type="button" data-filtro="todos" role="tab" aria-selected="true">
                    Todos
                </button>
                <button class="site-filtro-btn" type="button" data-filtro="direcao" role="tab" aria-selected="false">

                </button>
                <button class="site-filtro-btn" type="button" data-filtro="coordenacao" role="tab" aria-selected="false">

                </button>
                <button class="site-filtro-btn" type="button" data-filtro="professor" role="tab" aria-selected="false">

                </button>
                <button class="site-filtro-btn" type="button" data-filtro="apoio" role="tab" aria-selected="false">
                    Apoio e Limpeza
                </button>
            </div>

            <p id="equipeContador" class="site-equipe-contador muted" aria-live="polite"></p>

            <div id="equipeGrid" class="site-equipe-grid" role="tabpanel">

            <p id="equipeVazio" class="site-equipe-vazio" hidden>

    <div data-chrome="footer"></div>

</div>
