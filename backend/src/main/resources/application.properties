#  ERP-Academic-School-System - CONFIGURACAO DA APLICACAO

# --- APLICACAO ---
spring.application.name=ErpUniversityAcademicSystem
# --- PERFIL ATIVO ---
# local: carrega o application-local.properties, que fica FORA do Git
# e guarda as credenciais desta maquina. Em producao, defina SPRING_PROFILES_ACTIVE
# e forneca as credenciais por variavel de ambiente.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
# --- DATASOURCE (SQL SERVER) ---
# NUNCA coloque senha neste arquivo: ele e versionado e vai para o GitHub.
# O usuario e a senha vem do application-local.properties ou de DB_USER/DB_PASS.
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ErpUniversityAcademicSystem;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
# --- JPA / HIBERNATE ---
# update: o Hibernate CRIA/ATUALIZA as tabelas a partir das @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# --- E-MAIL ---
# provider: log (padrao, so registra no console) | smtp (envia de fato via spring.mail.*)
app.email.provider=${EMAIL_PROVIDER:log}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# --- UPLOAD (MULTIPART) ---
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# --- SERVIDOR ---
server.port=8080
server.servlet.context-path=/api
# --- OIDC (KEYCLOAK) ---
# Login, registro e emissao de tokens agora sao feitos pelo Keycloak (nao mais pelo
# backend). O backend so valida os tokens recebidos, usando o documento de descoberta
# OIDC do realm (ver SecurityConfig.jwtDecoder()).
oidc.issuer-uri=${OIDC_ISSUER_URI:http://localhost:8081/realms/uniaura}
# --- CLOUDSUPPORT ---
# Ativa o Resource Server (Spring Security valida o JWT emitido pelo Keycloak,
# via o JwtDecoder configurado em SecurityConfig).
cloudsupport.security.scheme=jwt
# Rotas publicas (sem autenticacao). Equivalente ao PUBLIC_MATCHERS que existia
# no SecurityConfig antes da migracao.
cloudsupport.security.allow-paths=/pre-matricula,/eventos-academicos/publicos,/certificados/verificar,/swagger-ui,/swagger-ui.html,/v3/api-docs,/swagger-resources,/webjars
# Claim do token OIDC de onde vem a lista de authorities (mapeada no Keycloak via
# o protocol mapper "roles-claim" do client uniaura-frontend).
cloudsupport.security.jwt.authorities-claim=roles
# O cloudsupport desativa o Swagger por padrao; reativa o comportamento anterior.
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
# Trata exceptions inesperadas (nao capturadas pelo GlobalExceptionHandler) com codigo
# de rastreamento e sem expor a mensagem interna. As exceptions conhecidas (BusinessException,
# ResourceNotFoundException, validacao, etc.) continuam no formato que o frontend ja espera,
# pois o GlobalExceptionHandler as intercepta antes deste mecanismo.
cloudsupport.error.conventions.enabled=true
# Ativa o motor de jobs/agendamento do cloudsupport (@Job, @Schedule). Ver
# erp.uniaura.modules.biblioteca.scheduler.EmprestimoVencidoJob/Schedule.
cloudsupport.annotations.enabled=true
cloudsupport.jobs.scheduling.enabled=true
# --- STORAGE DE ARQUIVOS (UPLOADS) ---
# type: local | s3
app.storage.type=${STORAGE_TYPE:local}
app.storage.local.base-path=${STORAGE_LOCAL_PATH:./storage}
app.storage.local.public-base-url=/files
# --- SPRINGDOC / SWAGGER ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# --- LOGGING ---
logging.level.root=INFO
logging.level.erp.uniaura=DEBUG
# --- DEV: INICIAR O FRONTEND (VITE) AUTOMATICAMENTE AO SUBIR O BACKEND ---
# true (padrao): o backend roda "npm run dev" e abre o navegador
# false: desativa (use em producao)
app.dev.start-frontend=${START_FRONTEND:true}
