#  ERP-Academic-School-System - CONFIGURACAO DA APLICACAO

# --- APLICACAO ---
spring.application.name=ErpUniversityAcademicSystem
# --- PERFIL ATIVO ---
# local: carrega o application-local.properties, que fica FORA do Git
# e guarda as credenciais desta maquina. Em producao, defina SPRING_PROFILES_ACTIVE
# e forneca as credenciais por variavel de ambiente.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
# --- DATASOURCE (SQL SERVER) ---
# NUNCA coloque senha neste arquivo: ele e versionado e vai para o GitHub.
# O usuario e a senha vem do application-local.properties ou de DB_USER/DB_PASS.
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=UniAuraErpDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
# --- JPA / HIBERNATE ---
# O banco e criado e alterado SO pelo Liquibase (db/changelog); o Hibernate apenas confere o mapeamento.
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
# Usa os nomes de tabela e coluna EXATAMENTE como declarados nas entidades (camelCase).
# Sem isto, o Spring Boot converte tudo para snake_case e o padrao muda conforme a execucao.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# --- E-MAIL ---
# provider: log (padrao, so registra no console) | smtp (envia de fato via spring.mail.*)
app.email.provider=${EMAIL_PROVIDER:log}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# --- UPLOAD (MULTIPART) ---
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# --- RECUPERACAO DE SENHA ---
# Os e-mails sao ficticios e nada e enviado: com true, o codigo de autorizacao volta na resposta e a tela o exibe
# numa caixa "e-mail simulado". Com e-mail real, ponha false e envie o codigo por e-mail.
app.recuperacao-senha.exibir-codigo=true
# --- BANNER ---
# O cloudsupport desliga o banner do Spring por padrao (cloudsupport.properties tem
# banner-mode=off, com a menor prioridade). Reativa o banner.txt do projeto no console.
spring.main.banner-mode=console
# --- SERVIDOR ---
server.port=8080
server.servlet.context-path=/api
# --- JWT ---
# O segredo real fica no application-local.properties ou na variavel JWT_SECRET.
# Precisa ter pelo menos 32 caracteres (256 bits): e o minimo exigido pelo HS256
# do Resource Server do cloudsupport (NimbusJwtDecoder).
security.jwt.secret=${JWT_SECRET:change-me-in-production-please-32chars}
security.jwt.issuer=erp-academic
# expiration-minutes: 480 = 8 horas
security.jwt.expiration-minutes=480
security.jwt.refresh-expiration-minutes=10080
# --- CLOUDSUPPORT ---
# Ativa o Resource Server (Spring Security valida o JWT emitido pelo TokenService,
# via o JwtDecoder configurado em SecurityConfig).
# Prefixo das URLs dos @Ws: /api/uniaura/<funcionalidade>.v1 (o frontend chama /uniaura/..., e o allow-paths abaixo usa o mesmo prefixo).
cloudsupport.ws.path-prefix=uniaura
cloudsupport.security.scheme=jwt
# Rotas publicas (sem autenticacao). Equivalente ao PUBLIC_MATCHERS que existia
# no SecurityConfig antes da migracao.
cloudsupport.security.allow-paths=/uniaura/autenticarUsuario.v1,/uniaura/renovarToken.v1,/uniaura/solicitarRecuperacaoDeSenha.v1,/uniaura/redefinirSenha.v1,/uniaura/realizarPreMatricula.v1,/uniaura/pesquisarEventosPublicos.v1,/uniaura/verificarCertificado.v1,/swagger-ui,/swagger-ui.html,/v3/api-docs,/swagger-resources,/webjars
# Claim do JWT de onde vem a lista de authorities (ver TokenService).
cloudsupport.security.jwt.authorities-claim=roles
# O cloudsupport desativa o Swagger por padrao; reativa o comportamento anterior.
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
# Convencoes de erro da cloudsupport: BusinessException e 422, @Valid devolve 422 com fieldMessages,
# erro de cliente devolve a mensagem e erro de servidor devolve so o codigo de rastreamento (tracking).
cloudsupport.error.conventions.enabled=true
# Ativa o motor de jobs/agendamento do cloudsupport (@Job, @Schedule). Ver erp.uniaura.services.jobs.
cloudsupport.annotations.enabled=true
cloudsupport.jobs.scheduling.enabled=true
# --- STORAGE DE ARQUIVOS (UPLOADS) ---
# type: local | s3
app.storage.type=${STORAGE_TYPE:local}
app.storage.local.base-path=${STORAGE_LOCAL_PATH:./storage}
app.storage.local.public-base-url=/files
# --- SPRINGDOC / SWAGGER ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# --- LOGGING ---
logging.level.root=INFO
logging.level.erp.uniaura=DEBUG
# --- DEV: INICIAR O FRONTEND (VITE) AUTOMATICAMENTE AO SUBIR O BACKEND ---
# true (padrao): o backend roda "npm run dev" e abre o navegador
# false: desativa (use em producao)
app.dev.start-frontend=${START_FRONTEND:true}
